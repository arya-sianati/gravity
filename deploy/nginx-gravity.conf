# Upstream for Daphne ASGI
upstream daphne_backend {
    server 127.0.0.1:8000;
}

# 1. HTTP Port 80 -> Redirect all traffic to https://gravity.college
server {
    listen 80;
    listen [::]:80;
    server_name gravity.college www.gravity.college;

    # Let's Encrypt ACME challenge location (for automated renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://gravity.college$request_uri;
    }
}

# 2. HTTPS Port 443 www -> Redirect to canonical apex https://gravity.college
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.gravity.college;

    ssl_certificate /etc/letsencrypt/live/gravity.college/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gravity.college/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        return 301 https://gravity.college$request_uri;
    }
}

# 3. Canonical Production Server: https://gravity.college
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gravity.college;

    # TLS Certificates
    ssl_certificate /etc/letsencrypt/live/gravity.college/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gravity.college/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self)" always;

    # Document Root for React PWA
    root /home/mule/gravity/frontend/dist;
    index index.html;

    # Django collected static files
    location /static/ {
        alias /home/mule/gravity/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Django Admin proxy
    location /admin/ {
        proxy_pass http://daphne_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Django REST API proxy
    location /api/ {
        proxy_pass http://daphne_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebSockets proxy
    location /ws/ {
        proxy_pass http://daphne_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # PWA Service Worker & Web Manifest: ensure fresh delivery
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Hashed static assets: cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Frontend React PWA SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
